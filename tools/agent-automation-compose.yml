name: vaultwarden-agent-automation
services:
  vault:
    image: ghcr.io/zqy5608/vaultwarden@sha256:204fab05736a444dc851413e0e4e33c3ad120c7fa68d379f1ccb68dca06c3387
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    environment:
      DOMAIN: https://localhost:18444
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 80
      ADMIN_TOKEN_FILE: /run/secrets/admin-token
      WEB_VAULT_ENABLED: "false"
      SIGNUPS_ALLOWED: "false"
      AGENT_API_ENABLED: "true"
      AGENT_REQUIRE_FOLDER_ACL: "true"
      LOG_LEVEL: error
    volumes:
      - /var/lib/vaultwarden-agent-automation:/data
      - /run/vaultwarden-agent-automation/admin-token:/run/secrets/admin-token:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    networks: [private]
    logging: {driver: none}
  api-tls:
    image: caddy@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    ports: [127.0.0.1:18444:18444]
    volumes:
      - /etc/vaultwarden-agent/automation-Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/vaultwarden-agent-automation-tls:/data
    tmpfs: ["/config:rw,nosuid,nodev"]
    networks: [private, loopback]
    logging: {driver: none}
networks:
  private:
    name: vaultwarden-agent-automation
    internal: true
  loopback:
    name: vaultwarden-agent-automation-loopback
