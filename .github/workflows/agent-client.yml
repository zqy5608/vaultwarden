name: Agent client
permissions: {}

on:
  push:
    paths:
      - "examples/agent-fill-client/**"
      - "examples/agent-test-site/**"
      - "tools/verify-agent-mcp.py"
      - "tools/verify-agent-native.py"
      - "tools/agent-*.sh"
      - "tools/agent-native-*"
      - "tools/vaultwarden-agent-*.service"
      - ".github/workflows/agent-client.yml"
  pull_request:
    paths:
      - "examples/agent-fill-client/**"
      - "examples/agent-test-site/**"
      - "tools/verify-agent-mcp.py"
      - "tools/verify-agent-native.py"
      - "tools/agent-*.sh"
      - "tools/agent-native-*"
      - "tools/vaultwarden-agent-*.service"
      - ".github/workflows/agent-client.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the packaged client and private browser
        run: |
          python3 -m venv "$RUNNER_TEMP/agent-client"
          "$RUNNER_TEMP/agent-client/bin/pip" install './examples/agent-fill-client[mcp]' './examples/agent-test-site[test]'
          "$RUNNER_TEMP/agent-client/bin/python" -m playwright install --with-deps --only-shell chromium
      - name: Allow Chromium sandbox user namespaces
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            cat <<EOF | sudo tee /etc/apparmor.d/vaultwarden-agent-ci >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile vaultwarden-agent-ci $HOME/.cache/ms-playwright/**/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/vaultwarden-agent-ci
          fi
      - name: Check reference clients and MCP credential boundaries
        run: |
          sh -n tools/agent-mcp-ssh.sh tools/agent-native-display.sh tools/agent-native-broker.sh
          "$RUNNER_TEMP/agent-client/bin/python" examples/agent-fill-client/test_client.py
          "$RUNNER_TEMP/agent-client/bin/python" examples/agent-fill-client/test_publish.py
          "$RUNNER_TEMP/agent-client/bin/python" examples/agent-fill-client/test_mcp.py
          "$RUNNER_TEMP/agent-client/bin/python" examples/agent-fill-client/test_setup.py
          "$RUNNER_TEMP/agent-client/bin/python" examples/agent-fill-client/test_broker_rpc.py
          "$RUNNER_TEMP/agent-client/bin/python" examples/agent-fill-client/test_native.py
          "$RUNNER_TEMP/agent-client/bin/python" -m unittest discover -s examples/agent-test-site -p 'test_*.py'

  native-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native browser calibration dependencies
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/agent-native-browsers"
          printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/agent-native"
          "$RUNNER_TEMP/agent-native/bin/pip" install './examples/agent-fill-client[mcp]' './examples/agent-test-site'
          "$RUNNER_TEMP/agent-native/bin/python" -m playwright install --with-deps chromium
          sudo apt-get install -y libnss3-tools
      - name: Allow the full Chromium sandbox
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            cat <<EOF | sudo tee /etc/apparmor.d/vaultwarden-agent-native-ci >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile vaultwarden-agent-native-ci $PLAYWRIGHT_BROWSERS_PATH/**/chrome flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/vaultwarden-agent-native-ci
          fi
      - name: Fetch the pinned public extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download browser-v2026.10.0 --repo bitwarden/clients \
            --pattern dist-chrome-2026.10.0.zip --skip-existing \
            --dir "$RUNNER_TEMP/native-extension"
      - name: Verify the isolated test service container
        env:
          AGENT_TEST_IMAGE: vaultwarden-agent-test:ci
          AGENT_TEST_TUNNEL_ID: 00000000-0000-4000-8000-000000000000
        run: |
          docker build --quiet -t vaultwarden-agent-test:ci ./examples/agent-test-site
          docker compose -f examples/agent-test-site/compose.yml config --quiet
          test ! -e /var/lib/vaultwarden-agent-test
          sudo install -d -m 0700 -o 10001 -g 10001 /var/lib/vaultwarden-agent-test
          trap 'docker compose -f examples/agent-test-site/compose.yml stop --timeout 10 test-site >/dev/null' EXIT
          docker compose -f examples/agent-test-site/compose.yml up -d --wait --wait-timeout 60 test-site
          python3 - <<'PY'
          import json, subprocess
          container = subprocess.check_output([
              'docker', 'compose', '-f', 'examples/agent-test-site/compose.yml',
              'ps', '-q', 'test-site'
          ], text=True).strip()
          state = json.loads(subprocess.check_output(['docker', 'inspect', container]))[0]
          assert state['State']['Health']['Status'] == 'healthy'
          assert state['Config']['User'] == '10001:10001'
          assert state['HostConfig']['ReadonlyRootfs']
          assert not state['HostConfig']['PortBindings']
          assert state['HostConfig']['CapDrop'] == ['ALL']
          assert 'no-new-privileges:true' in state['HostConfig']['SecurityOpt']
          assert set(state['NetworkSettings']['Networks']) == {'vaultwarden-agent-test-ingress'}
          network = json.loads(subprocess.check_output([
              'docker', 'network', 'inspect', 'vaultwarden-agent-test-ingress'
          ]))[0]
          assert network['Internal']
          print(json.dumps({'container_health': 'passed', 'runtime_isolation': 'passed'}))
          PY
      - name: Verify native passkeys with disposable credentials
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24 -nolisten tcp" \
            "$RUNNER_TEMP/agent-native/bin/python" tools/verify-agent-native.py \
            --extension-archive "$RUNNER_TEMP/native-extension/dist-chrome-2026.10.0.zip" \
            --report "$RUNNER_TEMP/native-passkey-report.json"
