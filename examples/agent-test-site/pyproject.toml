[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultwarden-agent-test-site"
version = "0.1.2"
description = "Owned password and WebAuthn relying party for Agent acceptance"
requires-python = ">=3.11"
dependencies = ["starlette==1.10.0", "uvicorn==0.54.0", "webauthn==3.0.1"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
vaultwarden-agent-test-site = "agent_test_site:main"

[tool.setuptools]
py-modules = ["agent_test_site", "test_site_pages", "test_site_state"]
