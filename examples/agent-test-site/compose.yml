name: vaultwarden-agent-test
services:
  test-site:
    image: ${AGENT_TEST_IMAGE:?Set the immutable release image}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    volumes: ["/var/lib/vaultwarden-agent-test:/data"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    networks:
      ingress:
        aliases: [agent-test]
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
  tunnel:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run, "${AGENT_TEST_TUNNEL_ID:?Set the dedicated tunnel UUID}"]
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      test-site: {condition: service_healthy}
    volumes:
      - /etc/vaultwarden-agent-test/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /etc/vaultwarden-agent-test/tunnel.json:/run/secrets/tunnel.json:ro
    networks: [ingress, egress]
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
networks:
  ingress:
    name: vaultwarden-agent-test-ingress
    internal: true
  egress:
    name: vaultwarden-agent-test-egress
