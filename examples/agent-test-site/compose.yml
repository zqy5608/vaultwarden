name: vaultwarden-agent-test
services:
  test-site:
    image: ${AGENT_TEST_IMAGE:?Set the immutable release image}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    ports: ["127.0.0.1:18082:18082"]
    volumes: ["/var/lib/vaultwarden-agent-test:/data"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    networks:
      ingress:
        aliases: [agent-test]
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
networks:
  ingress:
    name: vaultwarden-agent-test-ingress
    internal: true
